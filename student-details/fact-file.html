<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Universities · Student Recruit 360</title>
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="header.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="fact-file.css" />
<link rel="stylesheet" href="portal.css" />
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="universities.css" />
<!-- The first picture of the page waits until the menu has been drawn (see the marker at the end), so moving between pages never flashes an empty menu. -->
<link rel="expect" href="#isr-ready" blocking="render" />
</head>
<body>
  <header class="niec-header" data-page="factfile"></header>
  <main class="page">
    <div class="page-head">
      <div>
        <h1>Universities</h1>
        <p>Deadlines, entry requirements, fees and courses.</p>
      </div>
      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="Search a university or a course   ( / )" aria-label="Search universities and courses" autocomplete="off" />
      </div>
    </div>
    <div class="msg" id="msg" role="status"></div>
    <div class="ff-bar no-print" id="ffBar" hidden>
      <div class="p-seg ff-kind" role="group" aria-label="Universities or pathway colleges" id="ffKind">
        <button type="button" data-k="university" class="on" aria-pressed="true">Universities</button>
        <button type="button" data-k="pathway" aria-pressed="false">Pathway colleges</button>
      </div>
    </div>
    <div class="ff-soon no-print" id="ffSoon" hidden></div>
    <div class="count" id="count" aria-live="polite"></div>
    <div class="cards" id="cards"></div>
  </main>
<script src="session.js"></script>
<script src="ui.js"></script>
<script src="header.js"></script>
<script src="shortlist.js"></script>
<script src="backup-bar.js"></script>
<script src="card-fields.js"></script>
<script src="portal-ui.js"></script>
<script src="teams.js"></script>
<script src="fact-present.js"></script>
<script src="finder.js"></script>
<script src="fact-finder.js"></script>
<script src="fact-file.js"></script>
<span id="isr-ready" hidden></span>
</body>
</html>
