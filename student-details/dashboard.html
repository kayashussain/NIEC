<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Dashboard · Student Recruit 360</title>
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="header.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="dashboard.css" />
<link rel="stylesheet" href="portal.css" />
<link rel="stylesheet" href="theme.css" />
<!-- The first picture of the page waits until the menu has been drawn (see the marker at the end), so moving between pages never flashes an empty menu. -->
<link rel="expect" href="#sr360-ready" blocking="render" />
</head>
<body>
  <header class="niec-header" data-page="dashboard"></header>

  <main class="page first-load" id="page">
    <div class="page-head">
      <div>
        <h1>Dashboard</h1>
        <p>Applicants, sources and visas.</p>
      </div>
      <div class="filters" role="group" aria-label="Filter">
        <label>Intake <select id="intake"></select></label>
        <span class="updated" id="updated"></span>
      </div>
    </div>

    <!-- One page only: the figures the head of the consultancy needs. -->
    <div id="panel-overview"><div class="p-card"><div class="sr360-skel" role="status" aria-label="Loading"><i></i><i></i><i></i></div></div></div>
  </main>

  <div class="tip" id="tip" role="tooltip" hidden></div>

<script src="session.js"></script>
<script src="ui.js"></script>
<script src="header.js"></script>
<script src="card-fields.js"></script>
<script src="portal-ui.js"></script>
<script src="card-drawer.js"></script>
<script src="nepal-map.js"></script>
<script src="dashboard-trends.js"></script>
<script src="dashboard.js"></script>
<script src="dashboard-insights.js"></script>
<span id="sr360-ready" hidden></span>
</body>
</html>
