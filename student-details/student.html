<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Student · Student Recruit 360</title>
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="header.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="portal.css" />
<link rel="stylesheet" href="theme.css" />
<!-- The student card's own look (calm and alive, DESIGN.md): loaded after theme.css, only on this page. -->
<link rel="stylesheet" href="student-card.css" />
<!-- The one look of the student card for every person (Admin, Application, Mock, Follow-up, Manager), the owner, 24 Nov 2026. It comes last so no team style can change it. -->
<link rel="stylesheet" href="student-look.css" />
<!-- The first picture of the page waits until the menu has been drawn (see the marker at the end), so moving between pages never flashes an empty menu. -->
<link rel="expect" href="#sr360-ready" blocking="render" />
</head>
<body class="p-body p-student">
  <header class="niec-header" data-page="sheet"></header>
  <main class="p-page" id="page">
    <a class="p-back" href="/students" id="back">&larr; Back to All Students</a>
    <div class="p-embed-bar"><button type="button" class="btn btn-sm" id="closeEmbed">Close</button></div>
    <!-- While the student loads: a shimmering outline of the card (the badge, the name, the steps and the tiles), never a blank wait. -->
    <div id="view"><div class="sc-skel" aria-label="Loading the student" role="status"><div class="sc-skel-bar"><i class="sc-skel-av"></i><div><i class="sc-skel-line is-name"></i><i class="sc-skel-line is-short"></i></div></div><div class="sc-skel-cols"><i class="sc-skel-side"></i><i class="sc-skel-main"></i></div></div></div></div><i class="sc-skel-steps"></i><div class="sc-skel-tiles"><i></i><i></i><i></i><i></i><i></i><i></i></div><i class="sc-skel-src"></i></div></div>
  </main>
<script src="session.js"></script>
<script src="ui.js"></script>
<script src="header.js"></script>
<script src="card-fields.js"></script>
<script src="portal-ui.js"></script>
<script src="source-picker.js"></script>
<script src="intake-window.js"></script>
<script src="fact-finder.js"></script>
<script src="student-page.js"></script>
<span id="sr360-ready" hidden></span>
</body>
</html>
