<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f5f7" />
<meta name="robots" content="noindex, nofollow" />
<title>WhatsApp · Student Recruit 360</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="phone.css" />
</head>
<body class="wa-open">
  <main class="wa-box" id="view">
    <span class="wa-face" id="face" aria-hidden="true"></span>
    <p class="wa-kicker">WhatsApp</p>
    <h1 id="who">Opening the chat...</h1>
    <p id="num" class="wa-num"></p>
    <a class="wa-go" id="go" href="#">Open the chat in WhatsApp</a>
    <p class="p-muted p-small">If WhatsApp did not open by itself, tap the green button. The number is not saved on your phone.</p>
    <a class="p-link" id="web" href="#">Open with wa.me instead</a>
  </main>
<script src="wa-page.js"></script>
</body>
</html>
