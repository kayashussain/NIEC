<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="ISR" />
<meta name="theme-color" content="#f5f5f7" />
<title>WhatsApp on this phone · ISR</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="phone.css" />
</head>
<body class="ph-body">
  <main class="ph-box" id="view">
    <div class="ph-badge" id="badge" aria-hidden="true">
      <img class="ph-app" src="/apple-touch-icon.png" alt="" />
      <span class="ph-bubble"><svg viewBox="0 0 24 24"><path d="M5 4h14a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-6l-5 4v-4H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z" fill="currentColor"/></svg></span>
    </div>
    <p class="ph-kicker">WhatsApp on this phone</p>
    <h1 id="title">One moment...</h1>
    <p id="words" class="ph-words"></p>
    <ol class="ph-steps" id="steps" hidden></ol>
    <button type="button" class="ph-go" id="go" hidden>Turn on</button>
    <p class="ph-msg" id="msg" role="status"></p>
    <p class="ph-note" id="note" hidden>Nothing is saved on this phone. ISR only sends it a notification when you press WhatsApp on the computer.</p>
  </main>
<script src="pair-page.js"></script>
</body>
</html>
