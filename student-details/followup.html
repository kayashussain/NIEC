<style>
  /* 🔴 CSS CHANGED (2026-11-22): Vishnu Peacock Ocean, every colour in this file | from: the light ISR colours (page #e6e6e6, panels #f3f3f3, boxes #f7f7f7, black words #000, grey words #333, blue #0071e3, borders #9a9a9a to #6f6f6f) | to: the dark Peacock Ocean colours (page #0b2230, panels #13303f, tiles #19384a, boxes #0f2a38, light words #dde9ef, second words #a9c3cf, peacock blue #0f7fb3 and teal, borders #1f4658 to #4f7f95; orange, green and red kept as lighter tones that read on dark) */
/* 🔴 CSS CHANGED (2026-11-21): All Students for the Follow-up Team, the follow-up list (new page, design A2 approved by the owner) | from: the spreadsheet of All Students with every column, and Today, Dashboard and Follow-up in the menu | to: one list in the Vishnu colours: a grey switch (To follow up, Followed up, Deferred, With Application Team, Applying, Withdrawn, All, each with its count) and a search pill; tag filters; one solid panel (#f3f3f3, 1px #9a9a9a, 10px corners) with a grey title row and one row per student: No., the name in bold with the phone in blue and the remarks in grey under it, the stage as a grey pill (blue once with the Application Team), the last contact as a green "Followed up" or orange pill with the words said, the next follow-up date (orange once it has come, "Not set" in grey), the tag as three short buttons INT, DM, COLD (the chosen one blue), and Note and No answer; Note opens one line under the row (#e2e2e2): what the student said and the next follow-up date (both marked with a red *), Save note in blue, Defer, Withdrawn (which swaps the date for the reason and Confirm Withdrawn with a red outline) and Cancel; an empty required box gets a red line and a short shake. After an independent review the same day: the words said wrap to two lines in a wider column, reading text in the semi-bold 600, the boxes of the Note line the same 40px height and 8px corners, its buttons 44px tall, the pressed Note grey so Save note is the one blue action */
  .fu-page { max-width: 1500px; }
  .fu-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0 0 12px; }
  .fu-seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 11px; background: #1f4256; }
  .fu-seg button { min-height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; font: inherit; font-size: 15px; font-weight: 500; color: #dde9ef; cursor: pointer; transition: color .32s cubic-bezier(.4, 0, .6, 1), background-color .1s linear; }
  .fu-seg button.on { background: #0f2a38; color: #dde9ef; font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.128); }
  .fu-seg button i { margin-left: 6px; color: #dde9ef; font-style: normal; font-weight: 500; font-variant-numeric: tabular-nums; }
  html body .fu-search { width: 300px; max-width: 100%; height: 40px; padding: 0 16px; border: 1px solid #4f7f95; border-radius: 980px; background: #0f2a38; font: inherit; font-size: 15px; color: #dde9ef; box-sizing: border-box; }
  html body .fu-search:focus { box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.288); border-color: #0f7fb3; outline: none; }
  .fu-tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .fu-tags > span { color: #dde9ef; font-size: 14px; font-weight: 600; margin-right: 4px; }
  .fu-chip { min-height: 32px; padding: 0 13px; border-radius: 980px; border: 1px solid #3d6a80; background: #0f2a38; font: inherit; font-size: 14px; font-weight: 600; color: #dde9ef; cursor: pointer; transition: background-color .1s linear, color .32s cubic-bezier(.4, 0, .6, 1); }
  .fu-chip.on { background: #0f7fb3; border-color: #0f7fb3; color: #ffffff; }
  .fu-chip i { font-style: normal; font-weight: 500; margin-left: 5px; }
  .fu-list { background: #13303f; border: 1px solid #3d6a80; border-radius: 10px; overflow: hidden; }
  .fu-row { display: grid; grid-template-columns: 40px minmax(140px, .8fr) 112px minmax(240px, 2fr) 104px 142px 106px; gap: 12px; align-items: center; padding: 12px 18px; border-top: 1px solid #224658; font-size: 15px; }
  .fu-row.head { border-top: 0; background: #19384a; border-bottom: 1px solid #3d6a80; color: #dde9ef; font-size: 13px; font-weight: 600; padding-top: 10px; padding-bottom: 10px; }
  .fu-row.head + .fu-item .fu-row { border-top: 0; }
  .fu-row.head > * { white-space: nowrap; }
  .fu-num { color: #dde9ef; font-weight: 600; font-variant-numeric: tabular-nums; }
  .fu-who { min-width: 0; }
  .fu-name { padding: 0; border: 0; background: none; font: inherit; font-weight: 700; color: #dde9ef; text-align: left; cursor: pointer; }
  .fu-name:hover { color: #7fd3ee; text-decoration: underline; }
  .fu-phone { display: block; margin-top: 2px; font-size: 14px; font-weight: 600; color: #7fd3ee; }
  .fu-sub { display: block; margin-top: 3px; color: #dde9ef; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fu-from { display: inline-block; margin-top: 5px; padding: 1px 8px; border-radius: 6px; background: #19384a; border: 1px solid #3d6a80; font-size: 12.5px; font-weight: 600; color: #dde9ef; }
  .fu-stage { display: inline-block; padding: 3px 10px; border-radius: 980px; background: #19384a; border: 1px solid #3d6a80; font-size: 13px; font-weight: 600; color: #dde9ef; white-space: nowrap; }
  .fu-stage.app { background: #13303f; border-color: #0f7fb3; color: #7fd3ee; }
  .fu-last { min-width: 0; }
  .fu-pill { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 10px; border-radius: 980px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fu-pill::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; }
  .fu-pill.ok { background: #13303f; color: #6fd69a; }
  .fu-pill.ok::before { background: #2e9e5b; }
  .fu-pill.wait { background: #13303f; color: #f0a463; }
  .fu-pill.wait::before { background: #d9712a; }
  .fu-pill.view { background: #19384a; color: #dde9ef; }
  .fu-pill.view::before { display: none; }
  .fu-words { margin-top: 5px; color: #dde9ef; font-size: 14.5px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
  .fu-next b { font-weight: 700; color: #dde9ef; }
  .fu-next b.due { color: #f0a463; }
  .fu-next span { color: #dde9ef; font-size: 13.5px; font-weight: 600; }
  .fu-tg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; background: #1f4256; }
  .fu-tg button { min-height: 28px; padding: 0 9px; border: 0; border-radius: 7px; background: transparent; font: inherit; font-size: 13px; font-weight: 700; letter-spacing: .03em; color: #dde9ef; cursor: pointer; transition: background-color .1s linear, color .32s cubic-bezier(.4, 0, .6, 1); }
  .fu-tg button.on { background: #0f7fb3; color: #ffffff; }
  .fu-tg button:disabled { cursor: default; }
  .fu-code { display: inline-block; padding: 1px 7px; border-radius: 5px; border: 1px solid #4f7f95; font-size: 12px; font-weight: 700; letter-spacing: .04em; color: #dde9ef; }
  .fu-act { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .fu-act .btn { min-height: 34px; padding: 0 12px; font-size: 14px; white-space: nowrap; }
  .fu-act .btn.on { background: #19384a; border: 1px solid #4f7f95; color: #dde9ef; }
  .fu-view { color: #dde9ef; font-size: 13px; font-weight: 600; text-align: center; }
  .fu-strip { padding: 14px 20px 16px; border-top: 1px solid #224658; background: #19384a; display: flex; flex-direction: column; gap: 8px; }
  .fu-strip-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: start; }
  .fu-strip-grid > .fu-btns { align-self: end; }
  .fu-strip label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #dde9ef; }
  .fu-strip textarea { width: 100%; height: 40px; min-height: 40px; max-height: 220px; padding: 9px 14px; border: 1px solid #4f7f95; border-radius: 8px; background: #0f2a38; font: inherit; font-size: 15px; font-weight: 600; color: #dde9ef; box-sizing: border-box; resize: none; overflow: hidden; line-height: 1.4; }
  .fu-strip input[type="date"] { min-width: 172px; }
  .fu-strip input[type="date"], .fu-strip select { height: 40px; padding: 0 10px; border: 1px solid #4f7f95; border-radius: 8px; background: #0f2a38; font: inherit; font-size: 14.5px; font-weight: 600; color: #dde9ef; }
  .fu-strip input[type="date"]:disabled { opacity: .5; }
  .fu-strip .fu-req { color: #ff8a7e; font-weight: 700; }
  .fu-strip .bad { border-color: #d9473b !important; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.72) inset; animation: fu-shake .32s cubic-bezier(.4, 0, .6, 1); }
  .fu-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .fu-btns .btn { min-height: 44px; padding: 0 18px; font-size: 15px; }
  .fu-btns .btn.on { background: #0f7fb3; border-color: #0f7fb3; color: #ffffff; }
  .fu-btns .btn.red { border-color: #d9473b; color: #ff8a7e; }
  .fu-err { color: #ff8a7e; font-size: 13.5px; font-weight: 600; }
  .fu-hint { color: #dde9ef; font-size: 13.5px; font-weight: 600; }
  .fu-empty { padding: 34px 20px; color: #dde9ef; font-size: 15px; font-weight: 600; text-align: center; }
  @keyframes fu-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @media (prefers-reduced-motion: reduce) { .fu-strip .bad { animation: none; } }
</style>
<!-- The first picture of the page waits until the menu has been drawn (see the marker at the end), so moving between pages never flashes an empty menu. -->

<body class="p-body">
  <header class="niec-header" data-page="sheet"></header>
  <main class="p-page fu-page">
    <div class="p-head">
      <div>
        <h1>All Students</h1>
        <p id="lead">Click a name to open the student card with every note.</p>
      </div>
      <div class="p-actions"><button class="btn btn-primary" type="button" id="add">+ Add student</button></div>
    </div>
    <div class="fu-bar">
      <div class="fu-seg" id="views" role="group" aria-label="Show"></div>
      <input class="fu-search" id="find" type="search" placeholder="Search a name, phone or note" aria-label="Search the students" />
    </div>
    <div class="fu-tags" id="tags" role="group" aria-label="Show only one tag"></div>
    <section class="fu-list" id="list" aria-live="polite"><div class="isr-skel" role="status" aria-label="Loading"><i></i><i></i><i></i></div></section>
  </main>
<script src="session.js"></script>

<script src="student-file.js"></script>

</body>
