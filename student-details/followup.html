<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>All Students · Student Recruit 360</title>
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="header.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="portal.css" />
<link rel="stylesheet" href="theme.css" />
<style>
/* 🔴 CSS CHANGED (2026-11-25): the Follow-up Team's All Students, design F1 (approved by the owner on 25 Nov 2026) | from: the older grey Student Recruit 360 look (grey panels with dark outlines, grey switch, one list) with no tasks, and Hold and Withdrawn not shown together | to: the Apple look of the other teams: white soft panels, a soft segmented switch, a "Tasks for you" panel of tasks from other teams above the list, progress (Apply, Mock, Payment, CAS, Visa) and the latest news for students who moved on, a Stopped list (Hold and Withdrawn) with why and by whom, and a Bring back line */
  /* 🔴 CSS CHANGED (2026-11-25): the Follow-up page keeps its proportions at any browser zoom | from: never wider than 1500px, so zooming out squeezed the page into the middle with large empty sides | to: it always fills the space beside the menu with a slim margin, and its contents are scaled to that space (88 to 150 percent of the designed size, followup-page.js) */
  html:root body main.p-page.fu-page { max-width: none !important; margin: 0 !important; padding-left: 28px !important; padding-right: 28px !important; font-weight: 400; }
  html:root body .fu-page input.fu-search:not(:focus) { border: 0 !important; background: #e8e8ed !important; box-shadow: none !important; }
  html:root body .fu-page .fu-task .btn.on { background: #1d1d1f !important; color: #fff !important; }
  html body .fu-page .fu-panel { background: #fff; border: 0; border-radius: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05); overflow: hidden; }
  html body .fu-page .fu-tasks { margin: 0 0 22px; }
  html body .fu-page .fu-th { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 22px 10px; }
  html body .fu-page .fu-th h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.02em; color: #1d1d1f; }
  html body .fu-page .fu-count { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 8px; border-radius: 980px; background: #fff1e5; color: #a24800; font-size: 13px; font-weight: 600; }
  html body .fu-page .fu-thint { color: #636366; font-size: 14px; }
  html body .fu-page .fu-task { display: grid; grid-template-columns: 26px minmax(140px, 190px) minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 11px 22px; border-top: 1px solid #e5e5ea; font-size: 15px; }
  html body .fu-page .fu-ck { width: 24px; height: 24px; min-height: 0; padding: 0; border: 0; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 1.6px #b5b5ba; cursor: pointer; }
  html body .fu-page .fu-ck:hover { box-shadow: inset 0 0 0 2px #0071e3; }
  html body .fu-page .fu-task-text { font-weight: 500; overflow-wrap: anywhere; }
  html body .fu-page .fu-small { display: block; color: #636366; font-size: 13.5px; font-weight: 400; }
  html body .fu-page .fu-due { color: #636366; font-size: 13.5px; font-weight: 500; white-space: nowrap; }
  html body .fu-page .fu-due.late { color: #a24800; }
  html body .fu-page .fu-thread { padding: 4px 22px 16px 62px; border-top: 1px solid #e5e5ea; background: #fafafc; }
  html body .fu-page .fu-tempty { padding: 16px 22px; border-top: 1px solid #e5e5ea; color: #636366; font-size: 14.5px; }
  .fu-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0 0 12px; }
  .fu-seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 11px; background: #e8e8ed; }
  html body .fu-page .fu-seg button { min-height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; font: inherit; font-size: 14.5px; font-weight: 500; color: #1d1d1f; cursor: pointer; }
  html body .fu-page .fu-seg button:hover { background: rgba(0,0,0,.05); }
  html body .fu-page .fu-seg button.on { background: #fff; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .fu-seg button i { margin-left: 6px; color: #636366; font-style: normal; font-weight: 500; font-variant-numeric: tabular-nums; }
  html body .fu-page .fu-search { width: 300px; max-width: 100%; height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: #e8e8ed; box-shadow: none; font: inherit; font-size: 15px; font-weight: 400; color: #1d1d1f; box-sizing: border-box; }
  html body .fu-page .fu-search:focus { background: #fff; box-shadow: inset 0 0 0 2px #0071e3; outline: none; }
  .fu-tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .fu-tags[hidden] { display: none; }
  .fu-tags > span { color: #636366; font-size: 14px; font-weight: 500; margin-right: 4px; }
  html body .fu-page .fu-chip { min-height: 32px; padding: 0 13px; border: 0; border-radius: 980px; background: #e8e8ed; font: inherit; font-size: 14px; font-weight: 500; color: #1d1d1f; cursor: pointer; }
  html body .fu-page .fu-chip.on { background: #1d1d1f; color: #fff; }
  .fu-chip i { font-style: normal; font-weight: 500; margin-left: 5px; opacity: .65; }
  .fu-row { display: grid; gap: 12px; align-items: center; padding: 13px 22px; border-top: 1px solid #e5e5ea; font-size: 15px; }
  .fu-row.live { grid-template-columns: 30px minmax(140px, .9fr) 108px minmax(220px, 1.8fr) 100px 148px 170px; }
  .fu-row.moved { grid-template-columns: 30px minmax(140px, .9fr) minmax(180px, 1.1fr) minmax(220px, 1.3fr) minmax(180px, 1fr) 72px; }
  .fu-row.stop { grid-template-columns: 30px minmax(140px, .9fr) 112px minmax(220px, 1.8fr) minmax(130px, .7fr) 190px; }
  .fu-row.all { grid-template-columns: 30px minmax(150px, .9fr) 130px minmax(240px, 2fr) 170px; }
  .fu-row.head { border-top: 0; padding-top: 11px; padding-bottom: 11px; color: #636366; font-size: 13px; font-weight: 600; }
  .fu-row.head > * { white-space: nowrap; }
  .fu-num { color: #636366; font-variant-numeric: tabular-nums; }
  .fu-who { min-width: 0; }
  html body .fu-page .fu-name { min-height: 0; padding: 0; border: 0; background: none; font: inherit; font-weight: 600; letter-spacing: -.012em; color: #1d1d1f; text-align: left; cursor: pointer; }
  html body .fu-page .fu-name:hover { color: #0058b8; text-decoration: underline; }
  .fu-phone { display: block; margin-top: 2px; font-size: 14px; color: #0058b8; }
  .fu-sub { display: block; margin-top: 3px; color: #636366; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fu-from { display: inline-block; margin-top: 5px; padding: 1px 8px; border-radius: 6px; background: #f0f0f2; font-size: 12.5px; font-weight: 500; color: #515154; }
  .fu-stage { display: inline-block; padding: 3px 10px; border-radius: 980px; background: #f0f0f2; font-size: 13px; font-weight: 600; color: #515154; white-space: nowrap; }
  .fu-stage.app { background: #eaf3fe; color: #0058b8; }
  .fu-stage.hold { background: #fff1e5; color: #a24800; }
  .fu-stage.gone { background: #fdeceb; color: #b42318; }
  .fu-last { min-width: 0; }
  .fu-pill { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 10px; border-radius: 980px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fu-pill::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; }
  .fu-pill.ok { background: #e3f5e8; color: #1a7f37; }
  .fu-pill.ok::before { background: #1a7f37; }
  .fu-pill.wait { background: #fff1e5; color: #a24800; }
  .fu-pill.wait::before { background: #d9650b; }
  .fu-pill.view { background: #f0f0f2; color: #515154; }
  .fu-pill.view::before { display: none; }
  .fu-words { margin-top: 5px; color: #1d1d1f; font-size: 14.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; overflow-wrap: anywhere; }
  .fu-next b { font-weight: 600; color: #1d1d1f; }
  .fu-next b.due { color: #a24800; }
  .fu-next span { color: #636366; font-size: 13.5px; }
  .fu-tg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: #e8e8ed; }
  html body .fu-page .fu-tg button { min-height: 28px; padding: 0 9px; border: 0; border-radius: 7px; background: transparent; font: inherit; font-size: 12.5px; font-weight: 600; color: #1d1d1f; cursor: pointer; }
  html body .fu-page .fu-tg button.on { background: #0071e3; color: #fff; }
  .fu-code { display: inline-block; padding: 1px 7px; border-radius: 6px; background: #f0f0f2; font-size: 12px; font-weight: 600; color: #515154; }
  .fu-uni b { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .fu-track { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin: 0; padding: 0; list-style: none; }
  .fu-track li { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: #636366; }
  .fu-track li::before { content: ""; height: 5px; border-radius: 3px; background: #e3e3e8; }
  .fu-track li.d::before { background: #0071e3; }
  .fu-track li.d { color: #1d1d1f; }
  .fu-track li.n::before { background: linear-gradient(90deg, #0071e3 0 50%, #e3e3e8 50%); }
  .fu-track li.n { color: #0058b8; font-weight: 600; }
  .fu-upd b { display: block; font-size: 14px; font-weight: 500; }
  .fu-upd b.good, .fu-upd b.warn, .fu-upd b.bad { display: inline-block; padding: 2px 10px; border-radius: 980px; font-size: 13px; font-weight: 600; }
  .fu-upd b.good { background: #e3f5e8; color: #1a7f37; }
  .fu-upd b.warn { background: #fff1e5; color: #a24800; }
  .fu-upd b.bad { background: #fdeceb; color: #b42318; }
  .fu-act { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: nowrap; }
  html body .fu-page .fu-act .btn { min-height: 34px; padding: 0 12px; font-size: 14px; white-space: nowrap; }
  html body .fu-page .fu-act .btn.on { background: #1d1d1f; color: #fff; }
  .fu-view { color: #636366; font-size: 13px; text-align: right; }
  .fu-strip { padding: 14px 22px 16px 64px; border-top: 1px solid #e5e5ea; background: #fafafc; display: flex; flex-direction: column; gap: 8px; }
  .fu-strip-grid { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .fu-strip-grid > label:first-child { flex: 1 1 320px; }
  .fu-strip label { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 500; color: #636366; }
  .fu-strip label[hidden] { display: none; }
  html body .fu-page .fu-strip textarea { width: 100%; height: 42px; min-height: 42px; max-height: 220px; padding: 10px 14px; font: inherit; font-size: 15px; box-sizing: border-box; resize: none; overflow: hidden; line-height: 1.4; }
  html body .fu-page .fu-strip input[type="date"], html body .fu-page .fu-strip select { min-width: 172px; height: 42px; padding: 0 12px; font: inherit; font-size: 15px; }
  .fu-strip .fu-req { color: #b42318; font-weight: 700; }
  /* 🔴 CSS CHANGED (2026-11-27): quick days under a follow-up note | from: only the date box | to: a row of small buttons "Tomorrow, In 3 days, In 1 week, In 2 weeks" under it, the chosen one dark | why: one press for the usual days */
  .fu-quick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500; color: #636366; }
  .fu-quick[hidden] { display: none; }
  /* On a phone the quick days sit right under the date box, above Save note. */
  @media (max-width: 900px) { html body .fu-page .fu-strip .fu-strip-grid { display: contents; } html body .fu-page .fu-strip .fu-strip-grid > label { flex: none; } .fu-quick { order: 1; } html body .fu-page .fu-strip .fu-btns { order: 2; } .fu-strip .fu-err { order: 3; } .fu-strip .fu-hint { order: 4; } }
  html body .fu-page .fu-strip .bad { box-shadow: 0 0 0 2px #b42318 inset !important; animation: fu-shake .32s cubic-bezier(.4, 0, .6, 1); }
  .fu-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  html body .fu-page .fu-btns .btn { min-height: 42px; padding: 0 18px; font-size: 15px; }
  html body .fu-page .fu-btns .btn.red { color: #b42318; }
  .fu-err { color: #b42318; font-size: 13.5px; font-weight: 600; }
  .fu-hint { color: #636366; font-size: 13.5px; }
  .fu-empty { padding: 34px 20px; border-top: 1px solid #e5e5ea; color: #636366; font-size: 15px; text-align: center; }
  @keyframes fu-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @media (prefers-reduced-motion: reduce) { html body .fu-page .fu-strip .bad { animation: none; } }
  /* a narrower laptop: the wide rows keep their columns readable by wrapping the buttons under each other */
  @media (max-width: 1360px) { .fu-row { gap: 10px; padding-left: 16px; padding-right: 16px; } .fu-row.live { grid-template-columns: 32px minmax(120px, .9fr) 84px minmax(150px, 1.6fr) 100px 146px 156px; } .fu-row.moved { grid-template-columns: 32px minmax(130px, .9fr) minmax(150px, 1fr) minmax(200px, 1.3fr) minmax(150px, 1fr) 40px; } .fu-row.stop { grid-template-columns: 32px minmax(130px, .9fr) 92px minmax(180px, 1.6fr) minmax(110px, .7fr) 168px; } .fu-row.moved .fu-view { visibility: hidden; } }
  /* 🔴 CSS CHANGED (2026-11-27): phone and small tablet | from: the laptop's columns squeezed into the narrow screen, so a task's words stood one letter under another and the right side of every student (last contact, next day, tag, Note, No answer, Bring back) was cut off and could not be reached | to: each task and each student stacked under the name, every word and button inside the screen | why: the Follow-up Team could not work from a phone */
  @media (max-width: 900px) {
    html:root body main.p-page.fu-page { padding-left: 16px !important; padding-right: 16px !important; }
    html body .fu-page .fu-task { grid-template-columns: 26px minmax(0, 1fr) auto; gap: 6px 12px; align-items: start; padding: 14px 16px; }
    html body .fu-page .fu-task > :nth-child(3) { grid-column: 2 / -1; grid-row: 2; min-width: 0; }
    html body .fu-page .fu-task > :nth-child(4) { grid-column: 3; grid-row: 1; }
    html body .fu-page .fu-task > :nth-child(5) { grid-column: 2 / -1; grid-row: 3; justify-self: start; margin-top: 4px; }
    html body .fu-page .fu-thread { padding-left: 16px; padding-right: 16px; }
    html body .fu-page .fu-row.head { display: none; }
    html body .fu-page .fu-row.live, html body .fu-page .fu-row.moved, html body .fu-page .fu-row.stop, html body .fu-page .fu-row.all { grid-template-columns: 32px minmax(0, 1fr); gap: 8px 10px; align-items: start; padding: 14px 16px; }
    html body .fu-page .fu-row > * { grid-column: 2; min-width: 0; }
    html body .fu-page .fu-row > .fu-num { grid-column: 1; grid-row: 1 / span 6; padding-top: 2px; }
    html body .fu-page .fu-sub { white-space: normal; }
    html body .fu-page .fu-pill { white-space: normal; }
    html body .fu-page .fu-row.live .fu-next::before { content: "Next follow-up: "; color: #636366; font-size: 13.5px; }
    html body .fu-page .fu-row.stop > .fu-small::before { content: "Stopped by: "; }
    html body .fu-page .fu-row .fu-view { text-align: left; visibility: visible; }
    html body .fu-page .fu-act { justify-content: flex-start; flex-wrap: wrap; }
    html body .fu-page .fu-act .btn { min-height: 40px; }
    html body .fu-page .fu-tg button { min-height: 36px; min-width: 52px; }
    html body .fu-page .fu-strip { padding: 14px 16px 16px; }
    html body .fu-page .fu-search { width: 100%; }
  }
</style>
<!-- The first picture of the page waits until the menu has been drawn (see the marker at the end), so moving between pages never flashes an empty menu. -->
<link rel="expect" href="#sr360-ready" blocking="render" />
</head>
<body class="p-body">
  <header class="niec-header" data-page="sheet"></header>
  <main class="p-page fu-page">
    <div class="p-head">
      <div>
        <h1>All Students</h1>
        <p id="lead">Click a name to open the student card with every note.</p>
      </div>
      <div class="p-actions"><button class="btn btn-primary" type="button" id="add">+ Add student</button></div>
    </div>
    <section class="fu-panel fu-tasks" id="tasks" aria-label="Tasks for you" hidden></section>
    <div class="fu-bar">
      <div class="fu-seg" id="views" role="group" aria-label="Show"></div>
      <input class="fu-search" id="find" type="search" placeholder="Search a name, phone or note" aria-label="Search the students" />
    </div>
    <div class="fu-tags" id="tags" role="group" aria-label="Show only one tag"></div>
    <section class="fu-panel fu-list" id="list" aria-live="polite"><div class="sr360-skel" role="status" aria-label="Loading"><i></i><i></i><i></i></div></section>
  </main>
<script src="session.js"></script>
<script src="ui.js"></script>
<script src="header.js"></script>
<script src="card-fields.js"></script>
<script src="teams.js"></script>
<script src="portal-ui.js"></script>
<script src="source-picker.js"></script>
<script src="new-student.js"></script>
<script src="sender-setup.js"></script>
<script src="student-file.js"></script>
<script src="card-drawer.js"></script>
<script src="followup-page.js"></script>
<span id="sr360-ready" hidden></span>
</body>
</html>
