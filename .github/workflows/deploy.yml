# Puts a tested master on the live cPanel server by itself (the owner, 22 Nov 2026: "I push, you refresh, it is live").
# Runs only after the "Tests" workflow succeeded on master, and only when the four secrets below are set in GitHub
# (Settings, Secrets and variables, Actions). Without them it does nothing and says so. The data lives outside the repo
# (CPANEL_DEPLOY.md), so this never touches a student. Before the restart every server file is syntax-checked; if one does not load, the
# previous version is put back and nothing restarts. To switch it off, delete the secret DEPLOY_SSH_KEY.
#
#   DEPLOY_HOST      the server's name, for example niec.duckdns.org (or its SSH host)
#   DEPLOY_USER      the cPanel user name
#   DEPLOY_SSH_KEY   a private SSH key made only for this, whose public half is authorised in cPanel (SSH Access)
#   DEPLOY_PATH      the folder of the cloned repo on the server, for example /home/USER/uk-student-niec
#   DEPLOY_PORT      optional, the SSH port (22 when empty)
#   DEPLOY_SSH_PASSPHRASE   optional, the key's password if it has one (cPanel often insists on one)
name: Deploy to the live server

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master') }}
    runs-on: ubuntu-latest
    steps:
      - name: Update the live server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APP_PATH: ${{ secrets.DEPLOY_PATH }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER_NAME" ] || [ -z "$KEY" ] || [ -z "$APP_PATH" ]; then
            echo "The live server is not connected yet (the DEPLOY_ secrets are not all set), so nothing was deployed."
            [ -z "$HOST" ] && echo "Missing: DEPLOY_HOST"
            [ -z "$USER_NAME" ] && echo "Missing: DEPLOY_USER"
            [ -z "$KEY" ] && echo "Missing: DEPLOY_SSH_KEY"
            [ -z "$APP_PATH" ] && echo "Missing: DEPLOY_PATH"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Safe check (no secret shown): can the key be read, does it need a password, and which key is it (public fingerprint).
          if ssh-keygen -y -P "${PASSPHRASE:-}" -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2> ~/.ssh/keycheck.err; then
            echo "Key check: the private key can be read. Its fingerprint is $(ssh-keygen -lf ~/.ssh/deploy_key.pub | cut -d' ' -f1-2)"
          else
            echo "Key check FAILED: $(head -c 200 ~/.ssh/keycheck.err | tr '\n' ' ')"
            echo "(If it says incorrect passphrase, set DEPLOY_SSH_PASSPHRASE. If it says invalid format, the key was pasted wrongly.)"
            exit 1
          fi
          if ! ssh-keyscan -T 10 -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "Cannot reach the server on SSH port ${PORT:-22}. Check DEPLOY_HOST (the SSH host) and DEPLOY_PORT (the SSH port, for example 22 or the one cPanel shows)."
            exit 1
          fi
          [ -s ~/.ssh/known_hosts ] || { echo "The server gave no SSH answer on port ${PORT:-22}. Check DEPLOY_HOST and DEPLOY_PORT."; exit 1; }
          # A key with a password is unlocked once into an agent (the password is never written to a file or printed).
          ID_OPT=(-i ~/.ssh/deploy_key)
          if [ -n "$PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" > /dev/null
            printf '#!/bin/sh\nprintf "%s\\n" "$DEPLOY_PASSPHRASE"\n' '%s' > ~/.ssh/askpass
            chmod 700 ~/.ssh/askpass
            DEPLOY_PASSPHRASE="$PASSPHRASE" SSH_ASKPASS=~/.ssh/askpass SSH_ASKPASS_REQUIRE=force DISPLAY=none ssh-add ~/.ssh/deploy_key < /dev/null
            ID_OPT=()
          fi
          # The tested commit goes live: fetch it, reset the code to it (data is outside the repo), install what the server needs, restart.
          ssh "${ID_OPT[@]}" -p "${PORT:-22}" -o BatchMode=yes -o ConnectTimeout=20 "$USER_NAME@$HOST" \
            "set -e; cd '$APP_PATH'; git fetch origin master; OLD=\$(git rev-parse HEAD); git reset --hard '$SHA'; for d in \$HOME/nodevenv/*/*/bin; do [ -d \"\$d\" ] && PATH=\"\$d:\$PATH\"; done; if command -v npm >/dev/null 2>&1; then (cd student-details && npm install --omit=dev --no-audit --no-fund); else echo 'npm not found on the server, skipped the package install (the code is updated).'; fi; if command -v node >/dev/null 2>&1; then for f in gateway/server.js student-details/*.js shared/*.js; do node --check \"\$f\" || { echo \"A file does not load (\$f): putting the previous version back, nothing restarted.\"; git reset --hard \"\$OLD\"; exit 1; }; done; fi; mkdir -p student-details/tmp tmp; touch student-details/tmp/restart.txt tmp/restart.txt; echo \"Live is now at \$(git rev-parse --short HEAD)\""
